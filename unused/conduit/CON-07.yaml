# TODO(Mykyta): звірити назви елементів з інтерфейсом розгорнутої версії Conduit.
id: CON-07
title: Публікація нової статті
preconditions:
  - Користувач qa_user зареєстрований і увійшов до системи
steps:
  - Натиснути посилання «New Article» у верхньому меню.
  - Ввести в поле «Article Title» текст «Тестова стаття».
  - Ввести в поле «What's this article about?» текст «Опис».
  - Ввести в поле «Write your article (in markdown)» текст «Текст статті».
  - Ввести в поле «Enter tags» тег «qa» і натиснути Enter.
  - Натиснути кнопку «Publish Article».
expected:
  - Відкрилася сторінка статті із заголовком «Тестова стаття».
  - Під заголовком відображається ім'я поточного користувача «qa_user».
