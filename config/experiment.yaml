# Конфігурація основного експерименту.
# Experiment configuration. Values marked TODO must be filled in before the run.

experiment:
  name: main                 # results go to results/<name>/
  modes: [R1, R2, R3]
  max_iterations: 5          # K – maximum test runs in mode R3 (article, section 4.5)
  repeats: 3                 # repetitions of every test case × mode × model combination
  stability_runs: 3          # a passing test must pass this many consecutive runs
  testcases_dir: testcases

playwright:
  test_timeout_ms: 60000
  action_timeout_ms: 10000
  expect_timeout_ms: 5000

models:
  # Both models are called through OpenRouter (one key: OPENROUTER_API_KEY). Article, section 4.6.
  # Prices checked on openrouter.ai on 2026-10-25 (USD per 1M tokens, input / output).
  - id: claude-sonnet-5.5          # commercial model, $2 / $10
    provider: openai_compatible
    base_url: https://openrouter.ai/api/v1
    model: anthropic/claude-sonnet-5.5
    api_key_env: OPENROUTER_API_KEY
    temperature: 0
    max_tokens: 32000               # a ceiling only; reasoning models need room before the answer
    vision: true                   # send the failure screenshot in mode R3
  - id: deepseek-v4.1-flash        # open-weight model (deepseek-ai/DeepSeek-V4.1-Flash-1017 on Hugging Face), $0.15 / $0.60
    provider: openai_compatible
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v4.1-flash-1017
    api_key_env: OPENROUTER_API_KEY
    temperature: 0
    max_tokens: 32000               # a ceiling only; reasoning models need room before the answer
    vision: true

apps:
  # base_url – where the application runs locally (see apps/README.md)
  # reset_cmd – shell command that restores the initial data before every test run (optional)
  # context – facts a tester would know: test accounts, seed data. Passed to the model.
  todomvc:
    base_url: http://localhost:7002          # TodoMVC, examples/react, commit ff43b02 (`npm run serve`)
    start_path: /
    reset_cmd: null                          # todos are not persisted: every test starts with an empty list
    context: |
      The application does not persist todos, so every test starts with an empty list.
  juice-shop:
    base_url: http://localhost:3000            # OWASP Juice Shop 20.3.0, `npm start`
    start_path: /
    reset_cmd: python3 apps/juice_shop_reset.py   # creates the test user if missing, empties its basket
    # Test environment set-up (the same for every mode): the welcome dialog and the cookie banner are
    # already dismissed, as in a returning user's browser. Without it every test starts with two modal
    # dialogs that hide the page, and this single quirk decides the outcome of most one-shot tests.
    init_cookies:
      - {name: welcomebanner_status, value: dismiss}
      - {name: cookieconsent_status, value: dismiss}
    context: |
      The welcome dialog and the cookie banner are already dismissed by the test environment.
      Registered test user: email qa_user@example.com, password QaPassword123!,
      security question "Your eldest siblings middle name?", answer Kyiv.
      Prices are shown with the currency sign ¤, for example 1.99¤.
