id: ST-01
title: Додавання двох товарів до списку
preconditions:
  - Список порожній
steps:
  - Ввести в поле «New item» текст «Milk».
  - Натиснути кнопку «Add».
  - Ввести в поле «New item» текст «Bread».
  - Натиснути кнопку «Add».
expected:
  - Список «Items» містить «Milk» і «Bread».
  - Лічильник показує «2 items».
