# Перевірено на TodoMVC (React, коміт ff43b02); назви елементів звірено з інтерфейсом.
id: TODO-18
title: Повний сценарій роботи зі списком
preconditions:
- Список завдань порожній (застосунок не зберігає завдання між запусками)
steps:
- Ввести в поле «What needs to be done?» текст «Купити молоко» і натиснути Enter.
- Ввести в поле «What needs to be done?» текст «Написати статтю» і натиснути Enter.
- Ввести в поле «What needs to be done?» текст «Подзвонити керівнику» і натиснути Enter.
- Ввести в поле «What needs to be done?» текст «Забронювати квиток» і натиснути Enter.
- Натиснути прапорець ліворуч від завдання «Купити молоко».
- Натиснути прапорець ліворуч від завдання «Забронювати квиток».
- Двічі клацнути на тексті завдання «Написати статтю».
- Замінити текст завдання на «Написати статтю для Scopus».
- Натиснути Enter.
- Натиснути фільтр «Active» внизу списку.
- Натиснути кнопку «Clear completed» внизу списку.
- Натиснути фільтр «All» внизу списку.
expected:
- Після кроку 10 у фільтрі «Active» відображаються лише «Написати статтю для Scopus» і «Подзвонити керівнику».
- Після кроку 12 у списку залишилися лише ці два завдання, лічильник показує «2 items left!».
