# Перевірено на TodoMVC (React, коміт ff43b02); назви елементів звірено з інтерфейсом.
id: TODO-20
title: Масове позначення, видалення і додавання завдань
preconditions:
- Список завдань порожній (застосунок не зберігає завдання між запусками)
steps:
- Ввести в поле «What needs to be done?» текст «Купити молоко» і натиснути Enter.
- Ввести в поле «What needs to be done?» текст «Написати статтю» і натиснути Enter.
- Ввести в поле «What needs to be done?» текст «Подзвонити керівнику» і натиснути Enter.
- Натиснути кнопку позначення всіх завдань (стрілка ліворуч від поля «What needs to be done?»).
- Натиснути прапорець ліворуч від завдання «Написати статтю».
- Натиснути кнопку «Clear completed» внизу списку.
- Ввести в поле «What needs to be done?» текст «Підготувати презентацію» і натиснути Enter.
- Натиснути кнопку позначення всіх завдань (стрілка ліворуч від поля «What needs to be done?»).
- Натиснути фільтр «Completed» внизу списку.
- Натиснути кнопку «Clear completed» внизу списку.
- Натиснути фільтр «All» внизу списку.
expected:
- Після кроку 6 у списку залишилося лише завдання «Написати статтю».
- Після кроку 11 список порожній, а лічильник показує «0 items left!».
