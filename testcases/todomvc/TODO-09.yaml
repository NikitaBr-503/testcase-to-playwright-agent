# Перевірено на TodoMVC (React, коміт ff43b02); назви елементів звірено з інтерфейсом.
id: TODO-09
title: Видалення завдання через очищення тексту під час редагування
preconditions:
- Список завдань порожній (застосунок не зберігає завдання між запусками)
steps:
- Ввести в поле «What needs to be done?» текст «Купити молоко» і натиснути Enter.
- Ввести в поле «What needs to be done?» текст «Написати статтю» і натиснути Enter.
- Двічі клацнути на тексті завдання «Купити молоко».
- Видалити весь текст завдання.
- Натиснути Enter.
expected:
- Завдання «Купити молоко» зникло зі списку.
- У списку залишилося лише завдання «Написати статтю», лічильник показує «1 item left!».
