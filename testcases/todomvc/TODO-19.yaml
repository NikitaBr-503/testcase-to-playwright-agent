# Перевірено на TodoMVC (React, коміт ff43b02); назви елементів звірено з інтерфейсом.
id: TODO-19
title: Редагування завдання у фільтрі «Active»
preconditions:
- Список завдань порожній (застосунок не зберігає завдання між запусками)
steps:
- Ввести в поле «What needs to be done?» текст «Купити молоко» і натиснути Enter.
- Ввести в поле «What needs to be done?» текст «Написати статтю» і натиснути Enter.
- Ввести в поле «What needs to be done?» текст «Подзвонити керівнику» і натиснути Enter.
- Натиснути прапорець ліворуч від завдання «Купити молоко».
- Натиснути фільтр «Active» внизу списку.
- Двічі клацнути на тексті завдання «Подзвонити керівнику».
- Замінити текст завдання на «Подзвонити науковому керівнику».
- Натиснути Enter.
- Натиснути прапорець ліворуч від завдання «Подзвонити науковому керівнику».
- Натиснути фільтр «Completed» внизу списку.
- Натиснути фільтр «All» внизу списку.
expected:
- Після кроку 9 у фільтрі «Active» відображається лише завдання «Написати статтю».
- Після кроку 10 у фільтрі «Completed» відображаються «Купити молоко» і «Подзвонити науковому керівнику».
- Після кроку 11 лічильник показує «1 item left!».
