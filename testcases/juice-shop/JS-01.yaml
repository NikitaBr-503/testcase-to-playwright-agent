# TODO(Mykyta): звірити назви елементів з інтерфейсом розгорнутої версії OWASP Juice Shop.
id: JS-01
title: Вхід із неправильним паролем
preconditions:
  - Користувач qa_user@example.com зареєстрований
  - Користувач не увійшов до системи
steps:
  - Закрити вітальне вікно та банер про cookies.
  - Натиснути кнопку «Account» у верхньому меню.
  - Обрати пункт «Login».
  - Ввести в поле «Email» значення «qa_user@example.com».
  - Ввести в поле «Password» значення «WrongPassword1!».
  - Натиснути кнопку «Log in».
expected:
  - Відображається повідомлення про помилку «Invalid email or password.»
  - Користувач залишається на сторінці входу.
