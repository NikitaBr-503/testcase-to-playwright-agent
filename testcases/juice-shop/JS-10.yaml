# Перевірено на OWASP Juice Shop 20.3.0 (назви елементів звірено з інтерфейсом).
id: JS-10
title: Перехід на наступну сторінку каталогу
preconditions:
- Вітальне вікно і банер про cookies уже закриті (налаштування тестового середовища)
- Користувач не увійшов до системи
steps:
- Відкрити головну сторінку.
- Натиснути кнопку «Next page» під каталогом.
expected:
- Під каталогом відображається діапазон «16 – 30 of 46».
- Товару «Apple Juice (1000ml)» з першої сторінки на екрані немає.
