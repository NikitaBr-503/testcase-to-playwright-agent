# Перевірено на OWASP Juice Shop 20.3.0 (назви елементів звірено з інтерфейсом).
id: JS-13
title: Реєстрація з паролями, що не збігаються
preconditions:
- Вітальне вікно і банер про cookies уже закриті (налаштування тестового середовища)
- Користувач не увійшов до системи
steps:
- Відкрити головну сторінку.
- Натиснути кнопку «Account» у верхній панелі.
- Обрати пункт «Login».
- Натиснути посилання «Not yet a customer?».
- Ввести в поле «Email» значення «mismatch@example.com».
- Ввести в поле «Password» значення «Secret123!».
- Ввести в поле «Repeat Password» значення «Secret999!».
expected:
- Під полем «Repeat Password» відображається помилка «Passwords do not match».
- Кнопка «Register» недоступна для натискання.
