# Перевірено на OWASP Juice Shop 20.3.0 (назви елементів звірено з інтерфейсом).
id: JS-11
title: Зміна кількості товарів на сторінці
preconditions:
- Вітальне вікно і банер про cookies уже закриті (налаштування тестового середовища)
- Користувач не увійшов до системи
steps:
- Відкрити головну сторінку.
- У списку «Items per page» під каталогом обрати значення «30».
expected:
- Під каталогом відображається діапазон «1 – 30 of 46».
- На сторінці відображається 30 карток товарів.
