# Перевірено на OWASP Juice Shop 20.3.0 (назви елементів звірено з інтерфейсом).
id: JS-19
title: Пошук товару та додавання його до кошика
preconditions:
- Вітальне вікно і банер про cookies уже закриті (налаштування тестового середовища)
- Користувач qa_user@example.com зареєстрований
- Кошик користувача порожній
steps:
- Відкрити головну сторінку.
- Натиснути кнопку «Account» у верхній панелі.
- Обрати пункт «Login».
- Ввести в поле «Email» значення «qa_user@example.com».
- Ввести в поле «Password» значення «QaPassword123!».
- Натиснути кнопку «Log in».
- Натиснути іконку пошуку (лупа) у верхній панелі.
- Ввести в поле пошуку текст «banana» і натиснути Enter.
- Натиснути кнопку «Add to Basket» на картці товару «Banana Juice (1000ml)».
expected:
- Відображається заголовок «Search Results - banana».
- Відображається повідомлення «Placed Banana Juice (1000ml) into basket.»
- Лічильник на кнопці кошика показує 1.
