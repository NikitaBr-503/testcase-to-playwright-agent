# Перевірено на OWASP Juice Shop 20.3.0 (назви елементів звірено з інтерфейсом).
id: JS-21
title: Додавання нової адреси доставки
preconditions:
- Вітальне вікно і банер про cookies уже закриті (налаштування тестового середовища)
- Користувач qa_user@example.com зареєстрований
- Користувач не увійшов до системи
- У користувача немає збережених адрес
steps:
- Відкрити головну сторінку.
- Натиснути кнопку «Account» у верхній панелі.
- Обрати пункт «Login».
- Ввести в поле «Email» значення «qa_user@example.com».
- Ввести в поле «Password» значення «QaPassword123!».
- Натиснути кнопку «Log in».
- Натиснути кнопку «Account» у верхній панелі.
- Обрати пункт «Orders & Payment».
- Обрати пункт «My saved addresses».
- Натиснути кнопку «Add New Address».
- Ввести в поле «Country» значення «Ukraine».
- Ввести в поле «Name» значення «QA User».
- Ввести в поле «Mobile Number» значення «5012345678».
- Ввести в поле «ZIP Code» значення «01001».
- Ввести в поле «Address» значення «Khreshchatyk 1».
- Ввести в поле «City» значення «Kyiv».
- Ввести в поле «State» значення «Kyiv».
- Натиснути кнопку «Submit».
expected:
- Відображається повідомлення «The address at Kyiv has been successfully added to your addresses.»
- На сторінці «My saved addresses» відображається адреса з іменем «QA User» і містом «Kyiv».
