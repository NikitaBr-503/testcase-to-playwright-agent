# Перевірено на OWASP Juice Shop 20.3.0 (назви елементів звірено з інтерфейсом).
id: JS-08
title: Закриття вікна з описом товару
preconditions:
- Вітальне вікно і банер про cookies уже закриті (налаштування тестового середовища)
- Користувач не увійшов до системи
steps:
- Відкрити головну сторінку.
- Натиснути на назву товару «Apple Pomace» у каталозі.
- Натиснути кнопку «Close» у вікні товару.
expected:
- Вікно з описом товару закрилося.
- Відображається каталог із заголовком «All Products».
