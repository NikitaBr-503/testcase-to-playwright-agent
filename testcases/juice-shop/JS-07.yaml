# Перевірено на OWASP Juice Shop 20.3.0 (назви елементів звірено з інтерфейсом).
id: JS-07
title: Перегляд картки товару
preconditions:
- Вітальне вікно і банер про cookies уже закриті (налаштування тестового середовища)
- Користувач не увійшов до системи
steps:
- Відкрити головну сторінку.
- Натиснути на назву товару «Banana Juice (1000ml)» у каталозі.
expected:
- Відкрилося вікно з заголовком «Banana Juice (1000ml)».
- У вікні відображається ціна «1.99¤» і розділ «Reviews».
