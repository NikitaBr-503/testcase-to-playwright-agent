# Перевірено на OWASP Juice Shop 20.3.0 (назви елементів звірено з інтерфейсом).
id: JS-04
title: Пошук товару, якого немає в каталозі
preconditions:
  - Вітальне вікно і банер про cookies уже закриті (налаштування тестового середовища)
  - Користувач не увійшов до системи
steps:
  - Відкрити головну сторінку.
  - Натиснути іконку пошуку (лупа) у верхній панелі.
  - Ввести в поле пошуку текст «zzzz» і натиснути Enter.
expected:
  - Відображається повідомлення «No results found».
  - Жодної картки товару не відображається.
