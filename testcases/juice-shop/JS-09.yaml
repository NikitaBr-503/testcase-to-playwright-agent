# Перевірено на OWASP Juice Shop 20.3.0 (назви елементів звірено з інтерфейсом).
id: JS-09
title: Перехід на сторінку «About Us» через бічне меню
preconditions:
- Вітальне вікно і банер про cookies уже закриті (налаштування тестового середовища)
- Користувач не увійшов до системи
steps:
- Відкрити головну сторінку.
- Натиснути кнопку меню (☰) у лівому верхньому куті.
- Обрати пункт «About Us».
expected:
- Відкрилася сторінка із заголовком «About Us».
- На сторінці є розділ «Corporate History & Policy».
