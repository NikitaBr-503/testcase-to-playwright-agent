# Перевірено на OWASP Juice Shop 20.3.0 (назви елементів звірено з інтерфейсом).
id: JS-20
title: Зміна кількості товару в кошику
preconditions:
- Вітальне вікно і банер про cookies уже закриті (налаштування тестового середовища)
- Користувач qa_user@example.com зареєстрований
- Кошик користувача порожній
steps:
- Відкрити головну сторінку.
- Натиснути кнопку «Account» у верхній панелі.
- Обрати пункт «Login».
- Ввести в поле «Email» значення «qa_user@example.com».
- Ввести в поле «Password» значення «QaPassword123!».
- Натиснути кнопку «Log in».
- Натиснути кнопку «Add to Basket» на картці товару «Apple Juice (1000ml)».
- Натиснути кнопку кошика «Your Basket» у верхній панелі.
- У рядку товару «Apple Juice (1000ml)» натиснути кнопку збільшення кількості (іконка «+»).
- У рядку товару натиснути кнопку зменшення кількості (іконка «−»).
expected:
- 'Після кроку 9 кількість товару дорівнює 2, а загальна сума становить «Total Price: 3.98¤».'
- 'Після кроку 10 кількість товару дорівнює 1, а загальна сума становить «Total Price: 1.99¤».'
