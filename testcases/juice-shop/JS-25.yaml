# Перевірено на OWASP Juice Shop 20.3.0 (назви елементів звірено з інтерфейсом).
# Пройдено вручну (Mykyta). Перевірку Order History звірено з шаблоном order-history у v20.3.0.
id: JS-25
title: Повне оформлення замовлення з оплатою карткою
preconditions:
- Вітальне вікно і банер про cookies уже закриті (налаштування тестового середовища)
- Користувач qa_user@example.com зареєстрований
- Користувач не увійшов до системи
- Кошик користувача порожній
- У користувача немає збережених адрес і карток
steps:
- Відкрити головну сторінку.
- Натиснути кнопку «Account» у верхній панелі.
- Обрати пункт «Login».
- Ввести в поле «Email» значення «qa_user@example.com».
- Ввести в поле «Password» значення «QaPassword123!».
- Натиснути кнопку «Log in».
- Натиснути кнопку «Add to Basket» на картці товару «Apple Juice (1000ml)».
- Натиснути кнопку кошика «Your Basket» у верхній панелі.
- Натиснути кнопку «Checkout».
- На сторінці «Select an address» натиснути кнопку «Add New Address».
- Ввести в поле «Country» значення «Ukraine».
- Ввести в поле «Name» значення «QA User».
- Ввести в поле «Mobile Number» значення «5012345678».
- Ввести в поле «ZIP Code» значення «01001».
- Ввести в поле «Address» значення «Khreshchatyk 1».
- Ввести в поле «City» значення «Kyiv».
- Ввести в поле «State» значення «Kyiv».
- Натиснути кнопку «Submit».
- Обрати збережену адресу «QA User» у списку адрес.
- Натиснути кнопку «Continue».
- Обрати спосіб доставки «Standard Delivery».
- Натиснути кнопку «Continue».
- Розгорнути розділ «Add new card».
- Ввести в поле «Name» значення «QA User».
- Ввести в поле «Card Number» тестовий номер «4111111111111111».
- У списку «Expiry Month» обрати «12».
- У списку «Expiry Year» обрати «2090».
- Натиснути кнопку «Submit» у розділі картки.
- Обрати збережену картку, що закінчується на «1111».
- Натиснути кнопку «Continue».
- Натиснути кнопку «Place your order and pay».
- Натиснути кнопку «Account» у верхній панелі.
- Обрати пункт «Orders & Payment».
- Обрати пункт «Order History».
expected:
- Відображається повідомлення «Thank you for your purchase!»
- На сторінці підтвердження зазначено товар «Apple Juice (1000ml)».
- На сторінці «Order History» перше (найновіше) замовлення містить товар «Apple Juice (1000ml)» і має статус «In Transit».
